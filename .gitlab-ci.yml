# CI/CD pipeline for the PMS backend (.NET 9)
#
# build  -> restore + compile the solution
# test   -> unit + integration tests (in-memory DB), JUnit + Cobertura reports
# docker -> build the API image and push it to the GitLab Container Registry (develop/main/tags)
# deploy -> publish and zip-deploy to Azure App Service (automatic on push to `production`)
#
# Required CI/CD variables for deploy (Settings > CI/CD > Variables, Protected + Masked),
# printed by deploy/azure/setup-azure.sh:
#   AZURE_WEBAPP_URL      https://<app>.azurewebsites.net
#   AZURE_SCM_URL         https://<app>.scm.azurewebsites.net
#   AZURE_DEPLOY_USER     publishing username of the web app
#   AZURE_DEPLOY_PASSWORD publishing password of the web app

stages:
  - build
  - test
  - docker
  - deploy

variables:
  DOTNET_IMAGE: mcr.microsoft.com/dotnet/sdk:9.0
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  BUILD_CONFIGURATION: Release
  IMAGE_NAME: $CI_REGISTRY_IMAGE/pms-api

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.dotnet:
  image: $DOTNET_IMAGE
  cache:
    key:
      files:
        - PMS.sln
      prefix: nuget
    paths:
      - .nuget/packages
    policy: pull

build:
  extends: .dotnet
  stage: build
  cache:
    policy: pull-push
  script:
    - dotnet restore PMS.sln
    - dotnet build PMS.sln -c $BUILD_CONFIGURATION --no-restore

.test:
  extends: .dotnet
  stage: test
  needs: [build]
  script:
    - >
      dotnet test $TEST_PROJECT -c $BUILD_CONFIGURATION
      --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results/{assembly}.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
      --collect "XPlat Code Coverage"
      --results-directory $CI_PROJECT_DIR/coverage
      -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - test-results/
      - coverage/
    reports:
      junit: test-results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/*/coverage.cobertura.xml

unit-tests:
  extends: .test
  variables:
    TEST_PROJECT: tests/PMS.Application.UnitTests/PMS.Application.UnitTests.csproj

integration-tests:
  extends: .test
  variables:
    TEST_PROJECT: tests/PMS.Api.IntegrationTests/PMS.Api.IntegrationTests.csproj

docker-image:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [unit-tests, integration-tests]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG
  # The image is always built, so a broken Dockerfile fails the pipeline.
  # It is only pushed when the GitLab instance has a Container Registry ($CI_REGISTRY is set);
  # git.fsoft-academy.edu.vn has none today, so the login and push steps are skipped there.
  before_script:
    - |
      if [ -n "$CI_REGISTRY" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      else
        echo "No Container Registry on this GitLab instance: the image is built but not pushed."
        # $IMAGE_NAME would be "/pms-api", which is not a valid image name
        IMAGE_NAME="pms-api"
      fi
      export IMAGE_NAME
  script:
    - if [ -n "$CI_REGISTRY" ]; then docker pull "$IMAGE_NAME:$CI_COMMIT_REF_SLUG" || true; fi
    - >
      docker build
      --cache-from "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      -t "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
      .
    - |
      if [ -z "$CI_REGISTRY" ]; then
        echo "Image $IMAGE_NAME:$CI_COMMIT_SHORT_SHA built; push skipped."
        exit 0
      fi
      docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      docker push "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      fi

deploy-azure:
  extends: .dotnet
  stage: deploy
  needs: [unit-tests, integration-tests]
  environment:
    name: production
    url: $AZURE_WEBAPP_URL
  resource_group: production
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
  before_script:
    - |
      for v in AZURE_WEBAPP_URL AZURE_SCM_URL AZURE_DEPLOY_USER AZURE_DEPLOY_PASSWORD; do
        eval "val=\${$v}"
        if [ -z "$val" ]; then echo "Missing CI/CD variable: $v (see docs/CI-CD.md)"; exit 1; fi
      done
    - apt-get update -qq && apt-get install -y -qq zip > /dev/null
  script:
    - dotnet publish src/PMS.API/PMS.API.csproj -c $BUILD_CONFIGURATION -o publish /p:UseAppHost=false
    - (cd publish && zip -qr ../app.zip .)
    - >
      curl --fail-with-body -sS -X POST
      -u "$AZURE_DEPLOY_USER:$AZURE_DEPLOY_PASSWORD"
      --data-binary @app.zip
      "$AZURE_SCM_URL/api/zipdeploy?isAsync=false"
    # Free tier + paused serverless DB can take a while to cold start
    - |
      for i in $(seq 1 20); do
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$AZURE_WEBAPP_URL/swagger/index.html" || true)
        echo "Health check $i: HTTP $code"
        [ "$code" = "200" ] && exit 0
        sleep 15
      done
      echo "App did not become healthy - check Log stream in the Azure portal"
      exit 1
