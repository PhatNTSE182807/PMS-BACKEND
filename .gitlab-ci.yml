# CI/CD pipeline for the PMS backend (.NET 9)
#
# build  -> restore + compile the solution
# test   -> unit + integration tests (in-memory DB), JUnit + Cobertura reports
# docker -> build the API image and push it to the GitLab Container Registry (develop/main/production)
# deploy -> pull & restart the image on the server over SSH (automatic on push to `production`)
#
# Required CI/CD variables for deploy (Settings > CI/CD > Variables):
#   SSH_PRIVATE_KEY  (File, protected)  private key allowed to log in to the server
#   DEPLOY_HOST                         server hostname or IP
#   DEPLOY_USER                         SSH user (must be able to run docker)
#   DEPLOY_PATH                         directory on the server, e.g. /opt/pms
#   PROD_ENV_FILE    (File, protected)  .env for production, see docs/CI-CD.md
#   SSH_KNOWN_HOSTS  (optional)         output of `ssh-keyscan <host>` to pin the host key

stages:
  - build
  - test
  - docker
  - deploy

variables:
  DOTNET_IMAGE: mcr.microsoft.com/dotnet/sdk:9.0
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  BUILD_CONFIGURATION: Release
  IMAGE_NAME: $CI_REGISTRY_IMAGE/pms-api

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.dotnet:
  image: $DOTNET_IMAGE
  cache:
    key:
      files:
        - src/PMS.API/PMS.API.csproj
        - src/PMS.Application/PMS.Application.csproj
        - src/PMS.DataAccess/PMS.DataAccess.csproj
        - tests/PMS.Application.UnitTests/PMS.Application.UnitTests.csproj
        - tests/PMS.Api.IntegrationTests/PMS.Api.IntegrationTests.csproj
      prefix: nuget
    paths:
      - .nuget/packages
    policy: pull

build:
  extends: .dotnet
  stage: build
  cache:
    policy: pull-push
  script:
    - dotnet restore PMS.sln
    - dotnet build PMS.sln -c $BUILD_CONFIGURATION --no-restore

.test:
  extends: .dotnet
  stage: test
  needs: [build]
  script:
    - >
      dotnet test $TEST_PROJECT -c $BUILD_CONFIGURATION
      --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results/{assembly}.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
      --collect "XPlat Code Coverage"
      --results-directory $CI_PROJECT_DIR/coverage
      -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - test-results/
      - coverage/
    reports:
      junit: test-results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/*/coverage.cobertura.xml

unit-tests:
  extends: .test
  variables:
    TEST_PROJECT: tests/PMS.Application.UnitTests/PMS.Application.UnitTests.csproj

integration-tests:
  extends: .test
  variables:
    TEST_PROJECT: tests/PMS.Api.IntegrationTests/PMS.Api.IntegrationTests.csproj

docker-image:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [unit-tests, integration-tests]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "production"
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE_NAME:$CI_COMMIT_REF_SLUG" || true
    - >
      docker build
      --cache-from "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      -t "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
      .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "production" ]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      fi

deploy-production:
  stage: deploy
  image: alpine:3.20
  needs: [docker-image]
  environment:
    name: production
  resource_group: production
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
  before_script:
    - |
      for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH SSH_PRIVATE_KEY PROD_ENV_FILE; do
        eval "val=\${$v}"
        if [ -z "$val" ]; then echo "Missing CI/CD variable: $v (see docs/CI-CD.md)"; exit 1; fi
      done
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Prefer a pinned SSH_KNOWN_HOSTS variable; fall back to trusting the key on first use
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      fi
  script:
    - export SSH="ssh -i $SSH_PRIVATE_KEY $DEPLOY_USER@$DEPLOY_HOST"
    - $SSH "mkdir -p $DEPLOY_PATH"
    - scp -i "$SSH_PRIVATE_KEY" deploy/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
    - cp "$PROD_ENV_FILE" deploy.env
    - printf '\nPMS_API_IMAGE=%s\n' "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" >> deploy.env
    - scp -i "$SSH_PRIVATE_KEY" deploy.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"
    - >
      $SSH "cd $DEPLOY_PATH
      && echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'
      && docker compose pull pms-api
      && docker compose up -d --remove-orphans
      && docker image prune -f
      && docker compose ps"
