# Used by the GitLab `deploy` job. Copied to $DEPLOY_PATH on the server together
# with a `.env` file built from the PROD_ENV_FILE CI/CD variable.
services:
    pms-api:
        container_name: pms-api
        image: "${PMS_API_IMAGE}"
        restart: unless-stopped
        ports:
            - "${PMS_API_PORT:-8080}:8080"
        env_file:
            - .env
        depends_on:
            - pms-sqlserver

    pms-sqlserver:
        container_name: pms-sqlserver
        image: "mcr.microsoft.com/mssql/server:2022-latest"
        restart: unless-stopped
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
        volumes:
            - pms-sqldata:/var/opt/mssql

volumes:
    pms-sqldata:
