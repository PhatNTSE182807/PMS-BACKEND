version: "3.9"

services:
    pms-api:
        container_name: pms-api
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:80"
        depends_on:
            - pms-sqlserver

    pms-sqlserver:
        container_name: pms-sqlserver
        image: "mcr.microsoft.com/mssql/server:2022-latest"
        ports:
            - "1433:1433"
        environment:
            SA_PASSWORD: "S3cur3P@ssW0rd!"
            ACCEPT_EULA: "Y"
